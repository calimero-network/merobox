# Move every node to another merod-v2 build, one at a time, while the app keeps
# its data: what a release's on-disk and wire compatibility has to survive.
# MEROD_V2_UPGRADE_BINARY: the new build (defaults to MEROD_V2_BINARY).
name: Rolling upgrade
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 2730
accounts: [alice]
variables:
  next: "{{env.MEROD_V2_UPGRADE_BINARY ?? env.MEROD_V2_BINARY}}"
steps:
  - type: deploy
    account: alice
    wasm: "{{env.KV_STORE_WASM}}"
    outputs: { app: appId }
  - type: call
    account: alice
    app: "{{app}}"
    method: set
    args: { key: before, value: upgrade }
  - type: repeat
    count: 3
    steps:
      - name: Upgrade the next node
        type: restart_node
        node: "{{iteration_node}}"
        binary: "{{next}}"
      - name: The app answers through the mixed cluster
        type: wait_for
        account: alice
        app: "{{app}}"
        method: get
        args: { key: before }
        equals: upgrade
  - name: Writes work on the new build
    type: call
    account: alice
    app: "{{app}}"
    method: set
    args: { key: after, value: upgrade }
  - type: ops
    op: status
    outputs: { apps: apps }
  - type: assert
    statements:
      - "{{apps}} == 1"
