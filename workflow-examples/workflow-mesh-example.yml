description: A workflow demonstrating the create_mesh step that creates a context and connects multiple nodes in one step
name: Create Mesh Workflow Example

force_pull_image: true

nodes:
  count: 3
  image: ghcr.io/calimero-network/merod:edge
  prefix: calimero-node

steps:
  - name: Install Application on Node 1
    type: install_application
    node: calimero-node-1
    path: ./workflow-examples/res/com.calimero.kv-store-1.0.0.mpk
    dev: true
    outputs:
      app_id: applicationId

  - name: Create Mesh
    type: create_mesh
    context_node: calimero-node-1
    application_id: "{{app_id}}"
    nodes:
      - calimero-node-2
      - calimero-node-3
    outputs:
      context_id: contextId
      member_public_key: memberPublicKey
      namespace_id: namespaceId

  # The namespace the mesh built. Creating a subgroup under it is what the
  # export exists for, so the workflow does it rather than only asserting.
  - name: Create a Subgroup Under the Mesh Namespace
    type: create_group_in_namespace
    node: calimero-node-1
    namespace_id: "{{namespace_id}}"
    group_name: mesh-example-subgroup
    outputs:
      subgroup_id: groupId

  - name: Execute Contract Call - Set Key-Value from Node 1
    type: call
    node: calimero-node-1
    context_id: "{{context_id}}"
    method: set
    args:
      key: mesh_test
      value: "Hello from mesh!"
    outputs:
      set_result: result

  - name: Wait for Set Operation
    type: wait_for_sync
    context_id: "{{context_id}}"
    nodes:
      - calimero-node-1
      - calimero-node-2
      - calimero-node-3
    timeout: 60
    check_interval: 2
    trigger_sync: true

  - name: Execute View Call - Get Value from Node 2
    type: call
    node: calimero-node-2
    context_id: "{{context_id}}"
    method: get
    args:
      key: mesh_test
    outputs:
      get_result_node2: result

  - name: Execute View Call - Get Value from Node 3
    type: call
    node: calimero-node-3
    context_id: "{{context_id}}"
    method: get
    args:
      key: mesh_test
    outputs:
      get_result_node3: result

  - name: Execute Contract Call - Update from Node 2
    type: call
    node: calimero-node-2
    context_id: "{{context_id}}"
    method: set
    args:
      key: mesh_test
      value: "Updated from node 2!"
    outputs:
      update_result: result

  - name: Wait for Update Operation
    type: wait_for_sync
    context_id: "{{context_id}}"
    nodes:
      - calimero-node-1
      - calimero-node-2
      - calimero-node-3
    timeout: 60
    check_interval: 2
    trigger_sync: true

  - name: Verify Update from Node 2
    type: call
    node: calimero-node-2
    context_id: "{{context_id}}"
    method: get
    args:
      key: mesh_test
    outputs:
      verify_result_node2: result

  - name: Assert Mesh Variables
    type: assert
    statements:
      - "is_set({{context_id}})"
      - "is_set({{member_public_key}})"
      - "is_set({{public_key_calimero-node-2}})"
      - "is_set({{public_key_calimero-node-3}})"
      - "is_set({{namespace_id}})"
      - "is_set({{subgroup_id}})"
      - "{{context_id}} != ''"
      - "{{member_public_key}} != ''"
      - "{{subgroup_id}} != {{namespace_id}}"

  - name: Assert Cross-Node Operations
    type: assert
    statements:
      - "contains({{get_result_node2}}, 'Hello from mesh!')"
      - "contains({{get_result_node3}}, 'Hello from mesh!')"
      - "is_set({{set_result}})"
      - "is_set({{update_result}})"

  - name: Assert JSON Results
    type: json_assert
    statements:
      - 'json_subset({{get_result_node2}}, {"output": "Hello from mesh!"})'
      - 'json_subset({{get_result_node3}}, {"output": "Hello from mesh!"})'
      - 'json_subset({{verify_result_node2}}, {"output": "Updated from node 2!"})'

stop_all_nodes: true
restart: false
wait_timeout: 60
