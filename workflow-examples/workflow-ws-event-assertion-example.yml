description: Gate on what a node pushes over /ws, not on a log line
name: WebSocket Event Assertion Example

nodes:
  count: 2
  image: ghcr.io/calimero-network/merod:edge
  prefix: calimero-node
  base_port: 9022
  base_rpc_port: 9122

steps:
  - name: Install v1
    type: install_application
    node: calimero-node-1
    path: ./workflow-examples/res/kv_store.wasm
    dev: true
    outputs:
      app_v1: applicationId

  - name: Install v2
    type: install_application
    node: calimero-node-1
    path: ./workflow-examples/res/kv_store_v2.wasm
    dev: true
    outputs:
      app_v2: applicationId

  - name: Create Namespace
    type: create_namespace
    node: calimero-node-1
    application_id: '{{app_v1}}'
    outputs:
      namespace_id: namespaceId

  - name: Create Context
    type: create_context
    node: calimero-node-1
    application_id: '{{app_v1}}'
    group_id: '{{namespace_id}}'
    outputs:
      context_id: contextId

  - name: Invite node 2 to the namespace
    type: create_namespace_invitation
    node: calimero-node-1
    namespace_id: '{{namespace_id}}'
    outputs:
      invitation: invitation

  - name: Node 2 joins the namespace
    type: join_namespace
    node: calimero-node-2
    namespace_id: '{{namespace_id}}'
    invitation: '{{invitation}}'

  # The subscription has to be armed AFTER the announcement is published, or a
  # pass proves nothing about delivery. Partitioning node 2 first is what makes
  # that ordering real: it cannot fold the gossiped op while detached, and the
  # event stream has no replay to catch up from.
  - name: Cut node 2 off before the upgrade is published
    type: disconnect_node
    node: calimero-node-2

  - name: Let node 1 notice the peer is gone
    type: wait
    seconds: 5

  - name: Upgrade the namespace v1 -> v2 from node 1
    type: upgrade_group
    node: calimero-node-1
    group_id: '{{namespace_id}}'
    target_application_id: '{{app_v2}}'

  # No settle wait here on purpose - the watch window below IS the settle. A
  # wait would let node 2 fold the op unobserved and the assertion would pass
  # without ever seeing a frame.
  - name: Reattach node 2
    type: connect_node
    node: calimero-node-2

  - name: Assert MigrationStarted reached node 2 over /ws
    type: assert_ws_event
    node: calimero-node-2
    group_id: '{{namespace_id}}'
    event: MigrationStarted
    # Not fromVersion: a dev install carries no version, so it arrives as the
    # empty string - the "0.0.0" is toVersion. localContextsTotal is node 2's OWN
    # context count.
    match:
      data.localContextsTotal: 1
    timeout_seconds: 120
