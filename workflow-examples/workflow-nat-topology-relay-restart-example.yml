description: >
  Restarts the boot-node (the relay) of a `topology: { type: nat }` run
  and checks the clients recover through it.

  The boot-node runs `--dev`, whose fixed seed gives it the same peer id
  after a restart, so the clients' bootstrap address stays valid. The
  clients cannot reach each other except through the relay, so a write
  made after the restart only converges once the clients have
  re-established their relay reservations.

name: NAT Topology - Relay Restart

# NAT topology defines its own networks + boot-node; the normal
# cluster-wiring path is skipped under this branch. `restart: true`
# is meaningless here and explicitly ignored by the executor (logs a
# warning if set).
topology:
  type: nat
  nat_mode: cone

force_pull_image: false

# The nodes resolve `package@version` against their own registry, so this needs
# one serving the bundles - see workflow-install-by-coordinates-example.yml.
nodes:
  count: 2
  image: ghcr.io/calimero-network/merod:edge
  prefix: nat-client
  base_port: 9270
  base_rpc_port: 9370

steps:
  # ---------- Smoke: app install + context creation + join ----------

  - name: Install application on client-1
    type: install_application
    node: nat-client-1
    package: com.calimero.kv-store
    version: 1.0.0
    outputs:
      app_id: applicationId

  - name: Create namespace on client-1
    type: create_namespace
    node: nat-client-1
    application_id: '{{app_id}}'
    outputs:
      namespace_id: namespaceId

  - name: Create context in namespace on client-1
    type: create_context
    node: nat-client-1
    application_id: '{{app_id}}'
    group_id: '{{namespace_id}}'
    outputs:
      ctx_id: contextId

  - name: Create namespace invitation for client-2
    type: create_namespace_invitation
    node: nat-client-1
    namespace_id: '{{namespace_id}}'
    outputs:
      invitation: invitation

  # NAT topology takes longer to converge than a direct-dial cluster:
  # the relay-circuit establishment runs a per-namespace mesh-formation
  # round across the relay rather than peer-to-peer. 20s is generous;
  # the typical case finishes in 5-8.
  - name: Wait for relay-circuit gossip
    type: wait
    seconds: 20

  - name: Client-2 joins namespace via the relay
    type: join_namespace
    node: nat-client-2
    namespace_id: '{{namespace_id}}'
    invitation: '{{invitation}}'

  - name: Client-2 joins context via group membership
    type: join_context
    node: nat-client-2
    context_id: '{{ctx_id}}'

  # ---------- Restart the relay ----------

  - name: Restart the boot-node
    type: restart_container
    container: nat-topology-relay-restart-boot-node
    timeout: 60

  # ---------- Verify: write + read across the restarted relay ----------

  - name: Write key on client-1 after the restart
    type: call
    node: nat-client-1
    context_id: '{{ctx_id}}'
    method: set
    args:
      key: after_restart
      value: relayed_after_restart

  - name: Wait for sync through the restarted relay
    type: wait_for_sync
    context_id: '{{ctx_id}}'
    group_id: '{{namespace_id}}'
    nodes:
      - nat-client-1
      - nat-client-2
    timeout: 120
    trigger_sync: true

  - name: Read key on client-2
    type: call
    node: nat-client-2
    context_id: '{{ctx_id}}'
    method: get
    args:
      key: after_restart
    outputs:
      received: result

  - name: Assert the value crossed the restarted relay
    type: assert
    statements:
      - "contains({{received}}, 'relayed_after_restart')"

  - name: No panics or fatal errors
    type: assert_log_absent
    nodes:
      - nat-client-1
      - nat-client-2
    patterns:
      - "panicked at"
      - "thread 'main' panicked"
      - "FATAL"

stop_all_nodes: true
