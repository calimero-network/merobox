name: CI - Format Check, Unit Tests & Cloud-v2 Examples

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  # The core branch whose merod the cloud-v2 examples run against. It floats:
  # release-v2 has no core release to pin to yet. Core's own e2e.yml ("merobox
  # cloud-v2") runs the same examples against each core change, pinned to a
  # merobox ref, which is the gate in the other direction.
  CORE_V2_REF: "release-v2-parity"
  # Harden crates.io downloads against transient CI network blips that fail the
  # maturin build of calimero-client-py during `pip install` (seen as
  # "[16] HTTP2 framing layer" / "[56] SSL_read: unexpected eof"). More retries,
  # and disable HTTP/2 multiplexing which is the source of the framing errors.
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_MULTIPLEXING: "false"

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check code formatting
        run: |
          make format-check

      - name: Show formatting differences on failure
        if: failure()
        run: |
          echo "❌ Code formatting check failed!"
          echo "💡 To fix locally, run: make format"
          echo "📋 Showing differences:"
          make format-check || true

  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install merobox in development mode
        run: |
          pip install -e .

      - name: Run unit tests
        run: |
          python -m pytest merobox/tests/unit -v --tb=short

  # ── merobox's cloud-v2 examples against core's release-v2-parity merod ──
  # The same recipe as core's e2e.yml: merod, kv_store.wasm, two signed
  # kv-store releases for packages.yml, and a second, different merod for
  # rolling-upgrade.yml.
  test-cloud-v2:
    name: Cloud v2 examples
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Checkout core
        uses: actions/checkout@v4
        with:
          repository: calimero-network/core
          ref: ${{ env.CORE_V2_REF }}
          path: core

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      # Before pip: calimero-client-py is built from source with maturin.
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: cloud-v2

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Build merod
        working-directory: core
        run: |
          cargo build -p merod
          echo "MEROD_BINARY=$GITHUB_WORKSPACE/core/target/debug/merod" >> "$GITHUB_ENV"
          echo "MEROD_V2_BINARY=$GITHUB_WORKSPACE/core/target/debug/merod" >> "$GITHUB_ENV"

      - name: Build the fixtures
        working-directory: core
        run: |
          set -euo pipefail
          # core/rust-toolchain.toml pins its own toolchain; give it the target.
          rustup target add wasm32-unknown-unknown
          cargo build -p kv-store --target wasm32-unknown-unknown --profile app-release
          PATH="$(./scripts/setup-cargo-mero.sh):$PATH"
          mkdir -p target/e2e
          for v in 1.0.0 1.1.0; do
            (cd apps/kv-store && cargo mero bundle --dev --no-icon --app-version "$v")
            cp "dist/com.calimero.kv-store-$v.mpk" target/e2e/
          done
          # A second, different merod build for the rolling upgrade.
          cp target/debug/merod target/e2e/merod-next
          printf '\0' >> target/e2e/merod-next
          {
            echo "KV_STORE_WASM=$GITHUB_WORKSPACE/core/target/wasm32-unknown-unknown/app-release/kv_store.wasm"
            echo "KV_STORE_MPK=$GITHUB_WORKSPACE/core/target/e2e/com.calimero.kv-store-1.0.0.mpk"
            echo "KV_STORE_MPK_NEXT=$GITHUB_WORKSPACE/core/target/e2e/com.calimero.kv-store-1.1.0.mpk"
            echo "MEROD_V2_UPGRADE_BINARY=$GITHUB_WORKSPACE/core/target/e2e/merod-next"
          } >> "$GITHUB_ENV"

      - name: Run the examples
        run: |
          set -uo pipefail
          failed=0
          for wf in workflow-examples/cloud-v2/*.yml; do
            echo "::group::$wf"
            merobox cloud run "$wf" || { echo "::error::$wf failed"; failed=1; }
            echo "::endgroup::"
          done
          exit "$failed"
