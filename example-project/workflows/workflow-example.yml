description: A sample workflow that demonstrates the bootstrap functionality with dynamic value capture
name: Sample Calimero Workflow

# Never force pull: node 2 resolves the app from a registry the image is
# stamped to point at, and a pull would replace that image with an unstamped one.
force_pull_image: false

# Isolate the cluster from the public network, and wire the nodes to each other.
#
# Without this the nodes keep whatever `merod init` wrote into
# `bootstrap.nodes` — the public dev boot node — so both dial out to it, join
# that network, and reserve relay circuits on it. Rendezvous then publishes
# each node's EXTERNAL addresses, which are those circuits, so a node learns
# its sibling only as `/ip4/<public relay>/.../p2p-circuit/p2p/<sibling>` and
# never as the docker-bridge address it can actually reach. `identify` cannot
# close the gap, because it only reports listen addresses over an established
# connection — the very thing missing.
#
# That leaves mDNS as the only path to a directly dialable sibling address, and
# mDNS is not dependable enough to be the only one: on a busy bridge its
# packets fail to parse ("rdata length too large for remaining bytes"), the
# join finds no reachable peer, gets no group key, and returns HTTP 500 —
# taking every test that shares the session fixture with it. This is the flake
# investigated in calimero-network/core#3801.
#
# `e2e_mode` clears `bootstrap.nodes` and lets the cluster wiring supply the
# siblings' bridge addresses instead, which is what core's own e2e jobs get
# from `merobox bootstrap run --e2e-mode`. Set here rather than passed on the
# command line so running this workflow by hand behaves the same way CI does.
e2e_mode: true

# Step ordering mirrors workflow-examples/workflow-groups-example.yml,
# the known-good namespace + explicit join_context flow against
# merod:edge. The only deliberate divergence is `base_port` /
# `base_rpc_port`: this workflow runs alongside the `shared_cluster`
# session fixture (3 nodes on the default port range starting at 2428),
# so it must bind a non-overlapping port window. The groups-example
# Docker job runs on its own GHA runner without that fixture, which is
# why it can use the defaults.

nodes:
  count: 2
  image: ghcr.io/calimero-network/merod:edge
  prefix: calimero-node
  mdns: true
  base_port: 9000
  base_rpc_port: 9100

steps:
  - name: Install Application on Node 1
    type: install_application
    node: calimero-node-1
    package: com.calimero.kv-store
    version: 1.0.0
    outputs:
      app_id: applicationId

  - name: Create Namespace on Node 1
    type: create_namespace
    node: calimero-node-1
    application_id: '{{app_id}}'
    outputs:
      namespace_id: namespaceId

  - name: Create Context on Node 1
    type: create_context
    node: calimero-node-1
    application_id: '{{app_id}}'
    group_id: '{{namespace_id}}'
    outputs:
      context_id: contextId
      member_public_key: memberPublicKey

  - name: Create Identity on Node 2
    type: create_identity
    node: calimero-node-2
    outputs:
      public_key: publicKey

  - name: Wait for Identity Creation
    type: wait
    seconds: 5

  - name: Create Namespace Invitation on Node 1
    type: create_namespace_invitation
    node: calimero-node-1
    namespace_id: '{{namespace_id}}'
    outputs:
      invitation: invitation

  - name: Wait for Namespace Gossip
    type: wait
    seconds: 5

  - name: Node 2 Joins Namespace
    type: join_namespace
    node: calimero-node-2
    namespace_id: '{{namespace_id}}'
    invitation: '{{invitation}}'
    outputs:
      member_identity: memberIdentity

  - name: Node 2 Joins Group Context
    type: join_context
    node: calimero-node-2
    context_id: '{{context_id}}'

  - name: Execute Contract Call - Set Key-Value
    type: call
    node: calimero-node-1
    context_id: '{{context_id}}'
    method: set
    args:
      key: hello
      value: world
    outputs:
      set_result: result

  - name: Wait for Set Operation
    type: wait_for_sync
    context_id: '{{context_id}}'
    nodes:
      - calimero-node-1
      - calimero-node-2
    timeout: 60
    check_interval: 2
    trigger_sync: true

  - name: Execute View Call - Get Value
    type: call
    node: calimero-node-2
    context_id: '{{context_id}}'
    method: get
    args:
      key: hello
    outputs:
      get_result: result

  - name: Repeat Operations Multiple Times
    type: repeat
    count: 3
    outputs:
      current_iteration: iteration
    steps:
      - name: Set Key-Value Pair
        type: call
        node: calimero-node-1
        context_id: '{{context_id}}'
        method: set
        args:
          key: "iteration_{{current_iteration}}"
          value: "value_{{current_iteration}}"
        outputs:
          iteration_set_result: result

      - name: Wait for Set Operation
        type: wait_for_sync
        context_id: '{{context_id}}'
        nodes:
          - calimero-node-1
          - calimero-node-2
        timeout: 60
        check_interval: 2
        trigger_sync: true

      - name: Get Key-Value Pair
        type: call
        node: calimero-node-2
        context_id: '{{context_id}}'
        method: get
        args:
          key: "iteration_{{current_iteration}}"
        outputs:
          iteration_get_result: result

stop_all_nodes: false
restart: false
wait_timeout: 60
